<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Club Metropolitan - Fitness Activities App">
  <meta name="author" content="Julio César León">
  <meta name="keywords" content="fitness, gym, club, metropolitan, activities, classes, training">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cyberfanta.github.io/club_metropolitan/">
  <meta property="og:title" content="Club Metropolitan">
  <meta property="og:description" content="A Flutter application for Club Metropolitan fitness centers that allows members to browse, enroll and manage their fitness activities.">
  <meta property="og:image" content="https://cyberfanta.github.io/club_metropolitan/assets/images/extras/club_metropolitan_banner.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Club Metropolitan">
  <meta property="og:locale" content="en_US">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://cyberfanta.github.io/club_metropolitan/">
  <meta property="twitter:title" content="Club Metropolitan">
  <meta property="twitter:description" content="A Flutter application for Club Metropolitan fitness centers that allows members to browse, enroll and manage their fitness activities.">
  <meta property="twitter:image" content="https://cyberfanta.github.io/club_metropolitan/assets/images/extras/club_metropolitan_banner.svg">
  <meta property="twitter:creator" content="@cyberfanta">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Club Metropolitan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Club Metropolitan</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  
  <style>
    body {
      background-color: #FFFFFF;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    
    .loader {
      border: 8px solid #f3f3f3;
      border-radius: 50%;
      border-top: 8px solid #8B0000;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .app-name {
      font-family: Arial, sans-serif;
      font-size: 24px;
      color: #000000;
      margin-top: 16px;
    }

    .developer {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #666666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loader"></div>
    <div class="app-name">Club Metropolitan</div>
    <div class="developer">Developed by Julio César León</div>
  </div>
  
  <script>
    window.addEventListener('load', function(ev) {
      var loading = document.getElementById('loading');
      
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            loading.style.display = 'none';
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
