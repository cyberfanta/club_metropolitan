name: Simple Deploy to GitHub Pages
 
on:
  workflow_dispatch:

permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Icon generation failed, continuing..."
      
      - name: Generate splash screen
        run: dart run flutter_native_splash:create || echo "Splash screen generation failed, continuing..."
      
      - name: Build web
        run: flutter build web --release --base-href "/"
      
      - name: Copy assets for social sharing
        run: |
          mkdir -p build/web/assets/images/extras
          cp -r assets/images/extras/club_metropolitan_logo.svg build/web/assets/images/extras/ || echo "Logo not found, continuing..."
          cp -r assets/images/extras/club_metropolitan_banner.svg build/web/assets/images/extras/ || echo "Banner not found, continuing..."
      
      - name: Create additional files
        run: |
          touch build/web/.nojekyll
          echo "DirectoryIndex index.html" > build/web/.htaccess
          echo "ErrorDocument 404 /index.html" >> build/web/.htaccess
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Club Metropolitan</title><script>window.location.href = "/";</script></head><body><h1>Redirecting...</h1><p><a href="/">Click here if not redirected</a></p></body></html>' > build/web/404.html
          
          # Add banner and social media preview info
          sed -i 's|</head>|<meta property="og:image" content="assets/images/extras/club_metropolitan_banner.svg" />\n<meta property="og:title" content="Club Metropolitan" />\n<meta property="og:description" content="Fitness Activities App - Developed by Julio César León" />\n</head>|g' build/web/index.html
      
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true 