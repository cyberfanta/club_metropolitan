# DEPRECATED - PLEASE USE flutter-pages.yml INSTEAD
# This file is kept for reference only and should not be used
# The active workflow is flutter-pages.yml

name: Deploy to GitHub Pages

on:
  # Disable auto triggers
  # push:
  #   branches: [ master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get
      
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      
      - name: Generate splash screen
        run: dart run flutter_native_splash:create
      
      - name: Build web
        run: flutter build web --release --base-href /club_metropolitan/
      
      - name: Create assets directory in web build
        run: |
          mkdir -p build/web/assets/images/extras
          cp assets/images/extras/club_metropolitan_logo.svg build/web/assets/images/extras/
          cp assets/images/extras/club_metropolitan_banner.svg build/web/assets/images/extras/
      
      - name: Copy additional files
        run: |
          touch build/web/.nojekyll
          
          # Create .htaccess if not exists
          if [ ! -f web/.htaccess ]; then
            echo "DirectoryIndex index.html" > build/web/.htaccess
            echo "ErrorDocument 404 /club_metropolitan/index.html" >> build/web/.htaccess
          else
            cp web/.htaccess build/web/
          fi
          
          # Create 404.html if not exists
          if [ ! -f web/404.html ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Club Metropolitan</title><script>window.location.href = "/club_metropolitan/";</script></head><body><h1>Redirecting...</h1><p><a href="/club_metropolitan/">Click here if not redirected</a></p></body></html>' > build/web/404.html
          else
            cp web/404.html build/web/
          fi
          
          # Ensure README is not used as index
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0;URL=index.html">' > build/web/README.md
          
          # Create _config.yml to configure GitHub Pages
          echo 'include: [".htaccess"]' > build/web/_config.yml
      
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }} 