name: Flutter Web to GitHub Pages
 
on:
  push:
    branches: [ master ]
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run unit tests
        run: flutter test --exclude-tags=integration_test
      
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || echo "Icon generation failed, continuing..."
      
      - name: Generate splash screen
        run: dart run flutter_native_splash:create || echo "Splash screen generation failed, continuing..."
      
      - name: Build web
        run: flutter build web --release --base-href "/club_metropolitan/"
      
      - name: Copy assets for social sharing
        run: |
          mkdir -p build/web/assets/images/extras
          cp -r assets/images/extras/club_metropolitan_logo.svg build/web/assets/images/extras/ || echo "Logo not found, continuing..."
          cp -r assets/images/extras/club_metropolitan_banner.svg build/web/assets/images/extras/ || echo "Banner not found, continuing..."
      
      - name: Create additional files
        run: |
          touch build/web/.nojekyll
          echo "DirectoryIndex index.html" > build/web/.htaccess
          echo "ErrorDocument 404 /club_metropolitan/index.html" >> build/web/.htaccess
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Club Metropolitan</title><script>window.location.href = "/club_metropolitan/";</script></head><body><h1>Redirecting...</h1><p><a href="/club_metropolitan/">Click here if not redirected</a></p></body></html>' > build/web/404.html
          
          # Fix asset paths for GitHub Pages
          find build/web -type f -name "*.html" -exec sed -i 's|href="/"|href="/club_metropolitan/"|g' {} \;
          find build/web -type f -name "*.html" -exec sed -i 's|src="/"|src="/club_metropolitan/"|g' {} \;
          
          # Add banner and social media preview info
          sed -i 's|</head>|<meta property="og:image" content="/club_metropolitan/assets/images/extras/club_metropolitan_banner.svg" />\n<meta property="og:title" content="Club Metropolitan" />\n<meta property="og:description" content="Fitness Activities App - Developed by Julio César León" />\n</head>|g' build/web/index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 